openapi: 3.1.0
info:
  title: TestForge API
  version: 0.1.0
  description: |
    Contract shared by the web app, the CLI and the MCP server.

    Authentication:
    - Browser: `tf_session` cookie (HttpOnly) issued by sign-up or log-in.
      Unsafe methods with cookie auth must send an `Origin` header that matches
      the configured app origin.
    - Programmatic: `Authorization: Bearer tf_...` workspace API key. A key only
      reaches the workspace it belongs to and acts with the `member` role there.
      Creating workspaces and managing API keys require a browser session.
servers:
  - url: /
tags:
  - name: system
  - name: auth
  - name: workspaces
  - name: api-keys
  - name: connections
  - name: agents

paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      security: []
      responses:
        "200":
          description: Service and database are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      security: []
      description: Creates a user and a personal workspace, then starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Signed up and logged in.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429":
          description: Too many failed attempts for this email; retry later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: Ends the cookie session. With an API key it is a no-op.
      responses:
        "204": { description: Session ended and cookie cleared. }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      description: |
        Current user and the workspaces they can reach. With an API key, the
        user is the key's creator and only the key's workspace is listed.
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspaces the caller is a member of.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      description: Session only. The caller becomes the owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/v1/workspaces/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [workspaces]
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace with the caller's role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/connection-kinds:
    get:
      tags: [connections]
      operationId: listConnectionKinds
      description: Catalog of provider kinds and the form fields each one needs.
      responses:
        "200":
          description: Supported kinds.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectionKind" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/workspaces/{slug}/connections:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [connections]
      operationId: listConnections
      description: Any member. Secrets are never returned.
      responses:
        "200":
          description: Connections of the workspace, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [connections]
      operationId: createConnection
      description: Owner or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectionRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/v1/workspaces/{slug}/connections/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [connections]
      operationId: getConnection
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [connections]
      operationId: updateConnection
      description: |
        Owner or admin. Omitted properties keep their value; an omitted or
        empty `secret` keeps the stored secret, except when a URL field
        changes: then `secret` is required (422 on `secret`), so a stored
        credential is only ever sent to the hosts it was entered for.
        `config` replaces the whole config. The kind cannot change. Clears
        `lastTest`. Provider tests never follow redirects to another host.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectionRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [connections]
      operationId: deleteConnection
      description: Owner or admin.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/connections/{connectionId}/test:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: testConnection
      description: |
        Member or above. Calls the provider with the stored credentials and
        records the result as `lastTest`. A failed check is still a 200 with
        `ok: false`.
      responses:
        "200":
          description: Result of the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agent-codecs:
    get:
      tags: [agents]
      operationId: listAgentCodecs
      description: Catalog of codecs and the options each one takes.
      responses:
        "200":
          description: Supported codecs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentCodecSpec" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/agent-presets:
    get:
      tags: [agents]
      operationId: listAgentPresets
      description: Ready-made agent drafts. Applying one only fills an editable form.
      responses:
        "200":
          description: Presets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/workspaces/{slug}/agents:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [agents]
      operationId: listAgents
      description: Any member. Secret values are never returned.
      responses:
        "200":
          description: Agents of the workspace, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [agents]
      operationId: createAgent
      description: Owner or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/v1/workspaces/{slug}/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [agents]
      operationId: updateAgent
      description: |
        Owner or admin. Replaces the whole definition (same body as create).
        `modality` cannot change. Secrets: the list replaces the stored names;
        an entry with an empty `value` keeps the stored value of that name.
        When `transport.url` or `transport.preSession.url` changes, every
        secret must carry a value again (422 on `secrets`), so stored secrets
        only reach the hosts they were entered for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [agents]
      operationId: deleteAgent
      description: Owner or admin.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{slug}/agents/{agentId}/probe:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AgentId"
    post:
      tags: [agents]
      operationId: probeAgent
      description: |
        Member or above. Connects to the agent with its stored configuration
        and a fresh thread id, listens (voice) or sends one message (text),
        then closes. A failed probe is still a 200 with `ok: false`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProbeRequest" }
      responses:
        "200":
          description: Probe outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/v1/workspaces/{slug}/api-keys:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [api-keys]
      operationId: listApiKeys
      description: Session only. Any member can list keys; secrets are never returned.
      responses:
        "200":
          description: Keys of the workspace, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [api-keys]
      operationId: createApiKey
      description: Session only, role owner or admin. The secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/v1/workspaces/{slug}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - name: keyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      description: Session only, role owner or admin. Revoking twice is a no-op.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: tf_session
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: tf_<secret>

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }

    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }

    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with an existing resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Request body failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, conflict, invalid, rate_limited, internal]
            message: { type: string }
            fields:
              type: object
              description: Field name to validation message.
              additionalProperties: { type: string }

    Role:
      type: string
      enum: [owner, admin, member, viewer]

    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    Workspace:
      type: object
      required: [id, name, slug, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }

    Me:
      type: object
      required: [user, workspaces, authMethod]
      properties:
        user: { $ref: "#/components/schemas/User" }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        authMethod:
          type: string
          enum: [session, api_key]

    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 256 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    ApiKey:
      type: object
      required: [id, name, prefix, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: First characters of the key, for recognition (e.g. `tf_ab12cd34`).
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        createdBy:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expiresInDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650

    Capability:
      type: string
      enum: [llm, tts, stt, realtime, traces]

    ConnectionKindId:
      type: string
      enum: [openai, anthropic, azure_openai, azure_speech, langfuse]

    ConnectionField:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string, description: Property name inside `config`. }
        label: { type: string }
        type: { type: string, enum: [text, url] }
        required: { type: boolean }
        default: { type: [string, "null"] }
        placeholder: { type: [string, "null"] }
        help: { type: [string, "null"] }
        pattern:
          type: [string, "null"]
          description: Regular expression the value must match (text fields).

    ConnectionKind:
      type: object
      required: [kind, label, description, capabilities, fields, secretLabel, docsUrl]
      properties:
        kind: { $ref: "#/components/schemas/ConnectionKindId" }
        label: { type: string }
        description: { type: string }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        fields:
          type: array
          description: Non-secret settings, stored in `config`.
          items: { $ref: "#/components/schemas/ConnectionField" }
        secretLabel:
          type: string
          description: Label of the single secret, e.g. "API key" or "Secret key".
        docsUrl: { type: string, description: Where to find the credentials. }

    ConnectionTest:
      type: object
      required: [ok, message, latencyMs, testedAt]
      properties:
        ok: { type: boolean }
        message: { type: string, description: Human-readable outcome; never contains secrets. }
        latencyMs: { type: integer }
        testedAt: { type: string, format: date-time }

    Connection:
      type: object
      required: [id, name, kind, config, secretHint, capabilities, lastTest, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ConnectionKindId" }
        config:
          type: object
          additionalProperties: { type: string }
        secretHint:
          type: string
          description: Last 4 characters of the secret, e.g. `•••• 9f2c`.
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        lastTest:
          oneOf:
            - $ref: "#/components/schemas/ConnectionTest"
            - type: "null"
        createdBy:
          description: Null when the creator's account was deleted.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateConnectionRequest:
      type: object
      required: [name, kind, config, secret]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/ConnectionKindId" }
        config:
          type: object
          description: Values for the kind's fields; omitted fields take their default.
          additionalProperties: { type: string }
        secret: { type: string, minLength: 1, maxLength: 4096 }

    UpdateConnectionRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        config:
          type: object
          additionalProperties: { type: string }
        secret: { type: [string, "null"], maxLength: 4096 }

    Modality:
      type: string
      enum: [voice, text]

    CodecType:
      type: string
      enum: [vivi_live, openai_realtime, json_audio, http_json, http_stream]

    KeyValue:
      type: object
      required: [key, value]
      properties:
        key: { type: string, minLength: 1, maxLength: 200 }
        value:
          type: string
          maxLength: 4096
          description: Template; may reference `{{run.thread_id}}`, `{{var.*}}`, `{{secret.*}}`, `{{session.*}}`.

    PreSession:
      type: object
      description: Optional HTTP call made before connecting; its JSON response fields become `{{session.<name>}}`.
      required: [method, url, headers, body, captures]
      properties:
        method: { type: string, enum: [GET, POST] }
        url: { type: string, maxLength: 2048 }
        headers:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        body: { type: [string, "null"], maxLength: 20000, description: JSON template (POST only). }
        captures:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,39}$" }
              path: { type: string, description: Dot path into the JSON response, e.g. `session_id` or `data.id`. }

    Transport:
      type: object
      required: [url, query, headers, body, initMessages, preSession]
      properties:
        url:
          type: string
          maxLength: 2048
          description: |
            `wss://` or `https://` (`ws`/`http` only with private networking).
            Scheme and host are literal; the path may contain templates. No query
            string here: use `query`.
        query:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        headers:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        body:
          type: [string, "null"]
          maxLength: 20000
          description: HTTP agents only. JSON template that must reference `{{message}}`.
        initMessages:
          type: array
          maxItems: 10
          description: WebSocket agents only. JSON templates sent right after connecting.
          items: { type: string, maxLength: 20000 }
        preSession:
          oneOf:
            - $ref: "#/components/schemas/PreSession"
            - type: "null"

    Codec:
      type: object
      required: [type, options]
      properties:
        type: { $ref: "#/components/schemas/CodecType" }
        options:
          type: object
          description: Values for the codec's option fields; omitted options take their default.
          additionalProperties: { type: string }

    AgentCodecSpec:
      type: object
      required: [codec, label, description, modality, fields]
      properties:
        codec: { $ref: "#/components/schemas/CodecType" }
        label: { type: string }
        description: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/CodecField" }

    CodecField:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, number, boolean, json] }
        required: { type: boolean }
        default: { type: [string, "null"] }
        placeholder: { type: [string, "null"] }
        help: { type: [string, "null"] }

    AgentInput:
      type: object
      required: [name, description, modality, transport, codec, variables, secrets, traceConnectionId, traceSessionId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 20000 }
        modality: { $ref: "#/components/schemas/Modality" }
        transport: { $ref: "#/components/schemas/Transport" }
        codec: { $ref: "#/components/schemas/Codec" }
        variables:
          type: array
          maxItems: 50
          description: Non-secret values referenced as `{{var.<key>}}`.
          items: { $ref: "#/components/schemas/KeyValue" }
        secrets:
          type: array
          maxItems: 20
          description: Referenced as `{{secret.<name>}}`. An empty `value` keeps the stored one (update only).
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,39}$" }
              value: { type: string, maxLength: 4096 }
        traceConnectionId:
          type: [string, "null"]
          format: uuid
          description: A `traces` connection of the same workspace.
        traceSessionId:
          type: string
          maxLength: 500
          description: Template of the id the agent uses as its trace session id. Default `{{run.thread_id}}`.

    Agent:
      type: object
      required: [id, name, description, modality, transport, codec, variables, secrets, traceConnectionId, traceSessionId, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        transport: { $ref: "#/components/schemas/Transport" }
        codec: { $ref: "#/components/schemas/Codec" }
        variables:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        secrets:
          type: array
          items:
            type: object
            required: [name, hint]
            properties:
              name: { type: string }
              hint: { type: string, description: e.g. `•••• 9f2c` }
        traceConnectionId: { type: [string, "null"], format: uuid }
        traceSessionId: { type: string }
        createdBy:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentPreset:
      type: object
      required: [id, label, description, modality, draft, secretNames]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        draft:
          type: object
          required: [transport, codec, variables, traceSessionId]
          description: Values to fill the editor with; variable values may be empty placeholders.
          properties:
            transport: { $ref: "#/components/schemas/Transport" }
            codec: { $ref: "#/components/schemas/Codec" }
            variables:
              type: array
              items: { $ref: "#/components/schemas/KeyValue" }
            traceSessionId: { type: string }
        secretNames:
          type: array
          items: { type: string }

    ProbeRequest:
      type: object
      properties:
        message: { type: string, minLength: 1, maxLength: 2000, description: Text agents only. Default "Hello". }
        durationSeconds: { type: integer, minimum: 1, maximum: 30, description: Default 8. }

    ProbeEvent:
      type: object
      required: [atMs, kind, detail]
      properties:
        atMs: { type: integer, description: Milliseconds since the probe started. }
        kind:
          type: string
          enum: [connect, send, receive, ready, audio, transcript, reply, error, close, info]
        detail: { type: string, description: Never contains secret values. }

    ProbeResult:
      type: object
      required: [ok, summary, threadId, traceSessionId, events, audioMs, transcript, reply]
      properties:
        ok: { type: boolean }
        summary: { type: string }
        threadId: { type: string, format: uuid }
        traceSessionId: { type: string, description: Resolved trace session id for this probe. }
        events:
          type: array
          items: { $ref: "#/components/schemas/ProbeEvent" }
        audioMs: { type: integer, description: Milliseconds of agent audio received. }
        transcript: { type: string, description: Agent transcript captured (voice). }
        reply: { type: string, description: Agent reply (text). }

    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Full key. Shown only in this response.

security:
  - session: []
  - apiKey: []
