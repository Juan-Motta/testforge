name: testforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: testforge
      POSTGRES_PASSWORD: testforge
      POSTGRES_DB: testforge
    ports:
      # 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testforge -d testforge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
